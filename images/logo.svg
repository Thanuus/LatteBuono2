<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <!-- Círculo Externo Verde Escuro -->
  <circle cx="250" cy="250" r="235" fill="none" stroke="#253526" stroke-width="24"/>
  
  <!-- Fundo Creme Claro -->
  <circle cx="250" cy="250" r="223" fill="#F4EFE0"/>
  
  <!-- TEXTO SUPERIOR: LATTE BUONO -->
  <g transform="translate(250, 115)" text-anchor="middle" font-family="Arial Black, Impact, sans-serif" font-weight="900" letter-spacing="1">
    <text y="0" font-size="44" fill="#C93B2B">LATTE</text>
    <text y="38" font-size="44" fill="#C93B2B">BUONO</text>
  </g>
  
  <!-- Subtítulo -->
  <text x="250" y="172" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-weight="bold" font-size="11.5" fill="#253526" letter-spacing="0.5">
    Saúde e Vigor Para Você Todo Dia
  </text>
  
  <!-- Ramos Verdes Laterais -->
  <g fill="none" stroke="#7CB363" stroke-width="5" stroke-linecap="round">
    <path d="M 125,230 C 110,250 115,285 140,315 C 160,335 185,345 205,348"/>
    <path d="M 375,230 C 390,250 385,285 360,315 C 340,335 315,345 295,348"/>
  </g>
  <g fill="#7CB363">
    <path d="M120,235 Q110,230 115,220 Q125,225 120,235 Z"/>
    <path d="M113,255 Q103,252 106,242 Q116,245 113,255 Z"/>
    <path d="M112,275 Q102,275 103,265 Q113,265 112,275 Z"/>
    <path d="M118,295 Q110,300 110,290 Q118,285 118,295 Z"/>
    <path d="M130,315 Q125,322 120,312 Q128,307 130,315 Z"/>
    
    <path d="M380,235 Q390,230 385,220 Q375,225 380,235 Z"/>
    <path d="M387,255 Q397,252 394,242 Q384,245 387,255 Z"/>
    <path d="M388,275 Q398,275 397,265 Q387,265 388,275 Z"/>
    <path d="M382,295 Q390,300 390,290 Q382,285 382,295 Z"/>
    <path d="M370,315 Q375,322 380,312 Q372,307 370,315 Z"/>
  </g>

  <!-- ILUSTRAÇÃO DO BÚFALO CORRIGIDA (Fiel ao Original) -->
  <g fill="#1A1A1A">
    <!-- Chifres Longos e Curvados para Cima -->
    <path d="M 210,222 C 170,215 130,195 120,235 C 112,265 135,270 155,260 C 175,250 190,242 215,244 C 218,235 214,228 210,222 Z"/>
    <path d="M 290,222 C 330,215 370,195 380,235 C 388,265 365,270 345,260 C 325,250 310,242 285,244 C 282,235 286,228 290,222 Z"/>
    
    <!-- Orelhas Caídas Laterais -->
    <path d="M 165,255 C 145,260 132,275 142,288 C 150,295 162,285 172,272 Z"/>
    <path d="M 335,255 C 355,260 368,275 358,288 C 350,295 338,285 328,272 Z"/>
    
    <!-- Topo da Cabeça e Fronte -->
    <path d="M 210,222 Q 250,228 290,222 L 285,246 Q 250,250 215,246 Z"/>
    <path d="M 215,246 L 285,246 L 280,270 L 220,270 Z"/>
    
    <!-- Expressão dos Olhos e Linha da Bochecha -->
    <path d="M 205,255 L 225,255 L 228,275 L 208,272 Z"/>
    <path d="M 295,255 L 275,255 L 272,275 L 292,272 Z"/>
    
    <!-- Focinho Largo, Base da Boca e Queixo -->
    <path d="M 218,270 L 282,270 L 288,305 Q 288,328 250,332 Q 212,328 212,305 Z"/>
  </g>
  
  <!-- Detalhes Vazados e Contornos Internos (Fundo Creme) -->
  <g fill="#F4EFE0">
    <!-- Olhar característico e fendas dos olhos -->
    <path d="M 212,262 Q 218,258 224,263 Q 218,266 212,262 Z" fill="#F4EFE0"/>
    <path d="M 288,262 Q 282,258 276,263 Q 282,266 288,262 Z" fill="#F4EFE0"/>
    <circle cx="218" cy="262" r="1.5" fill="#1A1A1A"/>
    <circle cx="282" cy="262" r="1.5" fill="#1A1A1A"/>
    
    <!-- Detalhes realistas das Narinas Originais -->
    <path d="M 230,314 C 228,304 242,302 244,312 C 244,318 232,320 230,314 Z" fill="#1A1A1A"/>
    <path d="M 270,314 C 272,304 258,302 256,312 C 256,318 268,320 270,314 Z" fill="#1A1A1A"/>
    
    <!-- Linhas de contorno da face (Rugas da testa e focinho) -->
    <path d="M 232,236 Q 250,240 268,236" stroke="#1A1A1A" stroke-width="2.5" fill="none" stroke-linecap="round"/>
    <path d="M 236,244 Q 250,248 264,244" stroke="#1A1A1A" stroke-width="2" fill="none" stroke-linecap="round"/>
    <path d="M 230,285 Q 250,280 270,285" stroke="#1A1A1A" stroke-width="2.5" fill="none" stroke-linecap="round"/>
    <path d="M 235,294 Q 250,290 265,294" stroke="#1A1A1A" stroke-width="2" fill="none" stroke-linecap="round"/>
    <path d="M 242,324 Q 250,326 258,324" stroke="#1A1A1A" stroke-width="1.5" fill="none" stroke-linecap="round"/>
  </g>

  <!-- BANDEIRAS -->
  <g transform="translate(195, 345)">
    <!-- Itália -->
    <g>
      <rect x="0" y="0" width="12" height="16" fill="#009246"/>
      <rect x="12" y="0" width="12" height="16" fill="#F1F2F1"/>
      <rect x="24" y="0" width="12" height="16" fill="#CE2B37"/>
      <rect x="0" y="0" width="36" height="16" fill="none" stroke="#253526" stroke-width="1"/>
    </g>
    <!-- Brasil -->
    <g transform="translate(49, 0)">
      <rect x="0" y="0" width="36" height="16" fill="#009B3A"/>
      <polygon points="18,2 34,8 18,14 2,8" fill="#FFDF00"/>
      <circle cx="18" cy="8" r="4.5" fill="#002776"/>
      <rect x="0" y="0" width="36" height="16" fill="none" stroke="#253526" stroke-width="1"/>
    </g>
  </g>

  <!-- TEXTO INFERIOR: PRODUTO ARTESANAL -->
  <text x="250" y="412" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-weight="bold" font-size="20" fill="#253526" letter-spacing="1">
    PRODUTO ARTESANAL
  </text>
</svg>
